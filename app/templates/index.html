<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
  </head>
  <body>
    <main class="workspace" data-conversation-endpoint="{{ conversation_endpoint }}">
      <aside class="conversation-sidebar">
        <div class="sidebar-head">
          <p class="eyebrow">消防问答系统 2.0</p>
          <h1>历史会话</h1>
          <p class="sidebar-copy">
            每一轮都重新检索最新证据，但会保留你和系统当时的真实对话轨迹。
          </p>
          <button id="new-conversation-button" class="primary-button" type="button">新建会话</button>
        </div>

        <section class="sidebar-panel">
          <div class="panel-title-row">
            <p class="panel-title">会话列表</p>
            <span id="conversation-count" class="counter">0</span>
          </div>
          <ul id="conversation-list" class="conversation-list" aria-label="会话列表"></ul>
        </section>
      </aside>

      <section class="conversation-main">
        <header class="thread-header">
          <div>
            <p class="eyebrow">当前会话</p>
            <h2 id="conversation-title">请选择会话</h2>
            <p id="conversation-subtitle" class="thread-subtitle">会话详情、法律依据和修正提示会显示在这里。</p>
          </div>
          <div class="thread-actions">
            <button id="rename-conversation-button" class="ghost-button" type="button">重命名</button>
            <button id="delete-conversation-button" class="danger-button" type="button">删除</button>
          </div>
        </header>

        <section id="error-panel" class="feedback feedback-error" hidden aria-live="polite"></section>

        <section id="conversation-thread" class="conversation-thread" aria-live="polite">
          <div class="thread-empty">
            <p class="empty-title">还没有打开任何会话。</p>
            <p>你可以先新建一个会话，或者直接在下方输入问题，系统会自动为你建立当前会话。</p>
            <div class="starter-grid">
              <button type="button" class="starter-card" data-prompt="消防法关于消防安全责任制怎么规定？">
                <span>责任制</span>
                <small>从消防法切入</small>
              </button>
              <button type="button" class="starter-card" data-prompt="河北省消防条例第二十八条怎么规定？">
                <span>河北条例</span>
                <small>直接命中地方条文</small>
              </button>
              <button type="button" class="starter-card" data-prompt="它第二条怎么说？">
                <span>追问</span>
                <small>测试上下文承接</small>
              </button>
            </div>
          </div>
        </section>

        <form id="composer-form" class="composer-form">
          <label class="composer-label" for="composer-input">继续提问</label>
          <textarea
            id="composer-input"
            name="message"
            rows="4"
            placeholder="例如：消防法关于消防安全责任制怎么规定？"
            required
          ></textarea>
          <div class="composer-footer">
            <p id="request-status" class="request-status" aria-live="polite">等待输入。</p>
            <button id="send-button" class="primary-button" type="submit">发送问题</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
