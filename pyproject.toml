[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-law-rag"
version = "0.1.0"
description = "Local-only fire law RAG with offline indexing and a thin FastAPI chat UI."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "deepeval==4.1.4",
  "faiss-cpu>=1.14.3,<2.0",
  "fastapi>=0.135,<1.0",
  "jinja2>=3.1.6,<4.0",
  "langchain-community==0.4.1",
  "numpy>=2.4,<3.0",
  "openai==2.30.0",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "pydantic-settings>=2.13,<3.0",
  "ragas==0.4.3",
  "rich==13.9.4",
  "sentence-transformers>=5.3,<6.0",
  "trulens-core==2.9.0",
  "trulens-feedback==2.9.0",
  "uvicorn>=0.42,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "playwright>=1.62,<2.0",
  "pytest-playwright>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
