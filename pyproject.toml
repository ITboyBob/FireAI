[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-law-rag"
version = "0.1.0"
description = "Local-only fire law RAG with offline indexing and a thin FastAPI chat UI."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "faiss-cpu>=1.13,<2.0",
  "fastapi>=0.135,<1.0",
  "jinja2>=3.1.6,<4.0",
  "numpy>=2.4,<3.0",
  "openai>=2.30,<3.0",
  "pydantic-settings>=2.13,<3.0",
  "sentence-transformers>=5.3,<6.0",
  "uvicorn>=0.42,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
